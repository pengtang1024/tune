name: 缺陷报告
description: 报告一个可复现的问题：崩溃、功能异常、界面错位、播放失败等。
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把「怎么复现」写清楚——能稳定复现的问题才有可能被修掉。

        - 提交前请先搜索现有 issue，避免重复。
        - 报**安全漏洞**请不要开公开 issue，走 [SECURITY.md](https://github.com/pengtang1024/tune/blob/develop/SECURITY.md) 里的私密渠道。
        - 使用问题、讨论与求助请走 [SUPPORT.md](https://github.com/pengtang1024/tune/blob/develop/SUPPORT.md)。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 用一两句话说清出了什么问题、影响哪一块功能。
      placeholder: 例如：在音乐库按「专辑」浏览时，点击专辑卡片后内容区一直空白，需要重启才好。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 一步一步写，从启动应用开始；写清点了哪里、看到了什么。
      placeholder: |
        1. 启动 Tune，进入「音乐库」
        2. 切到「专辑」视图
        3. 点击任意一张专辑卡片
        4. 观察到 …
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应该发生什么。
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么；有报错弹窗就贴原文。
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: 请把三行都填上，缺项会让问题难以定位。
      value: |
        - Tune 版本（设置 → 关于 里的版本号，如 1.32.0+52）：
        - 发行版与桌面环境（如 Ubuntu 24.04 / GNOME 46 / Wayland；Linux 桌面是主验收平台，请写清 GNOME 还是 KDE、是否 Wayland）：
        - Flutter / Dart 版本（自己编译时填；`flutter --version` 的输出）：
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: |
        贴 `flutter run -d linux` 的输出（用官方安装包时贴启动日志或崩溃堆栈）。
        只贴与问题相关的片段，能用代码块围起来更好。
        **不要粘贴 token、API key、cookie、凭据，也不要把个人目录的绝对路径（含用户名）原样贴出来**，请先脱敏。
      render: shell
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 问题范围
      description: 选最接近的一项，方便归类。
      options:
        - 音乐库扫描
        - 音源与在线搜索
        - 播放与队列
        - 歌词与本地 AI
        - 发现
        - 设置
        - 桌面集成
        - 更新
        - 打包发布
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issue，没有找到相同的问题
          required: true
        - label: 我使用的已经是最新版本（或已确认该问题在最新版本上仍存在）
          required: true
        - label: 日志与截图已脱敏，不含 token、密钥或个人信息
          required: true
