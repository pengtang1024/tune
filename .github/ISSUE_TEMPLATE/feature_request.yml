name: 功能建议
description: 提一个改进建议或新功能想法（先讲痛点，再讲方案）。
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请**先说清要解决什么问题**，再说你希望它变成什么样——
        直接描述实现细节的请求往往很难评估，讲清痛点更容易被采纳。

        提交前请先搜索现有 issue，避免重复；也请先看下面的「项目边界」，
        不在范围内的方向大概率不会被合入。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在遇到的是什么麻烦？在什么场景下发生？现在的做法为什么不够用？
      placeholder: 例如：曲库上万首时，想找上周听过的某张专辑只能翻列表，没有按添加时间回看的入口。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 你希望它怎么工作：入口在哪、看到什么、怎么操作。写行为，不必写实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你现在怎么绕过这个问题？有没有别的做法你觉得也行？没有就写「无」。
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 适用范围
      description: 选最接近的一项。
      options:
        - 音乐库
        - 音源
        - 播放
        - 歌词
        - 发现
        - 设置
        - 桌面集成
        - 其它
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ### 项目边界（来自 AGENTS.md §4 与音源设计）

        - **Linux 桌面是主验收平台**。Windows / Android / iOS 保留工程入口，但不是 v1 验收目标；
          **macOS 与 Web 不再支持**，平台工程入口与相关代码已移除——不要按这两个平台提方案。
        - **不在 v1 桌面主链路**：均衡器、播放历史页、账号系统（社区此前已多次讨论过，暂不接收）。
          移动端通知栏 / 锁屏控制同样不在桌面主链路内（Android 侧由 `audio_service` 单独实现）。
        - **不支持任意脚本插件**：曾支持的 MusicFree JS 插件能力已下线（能执行任意代码、访问网络，
          合规与安全风险不可接受）。自定义音源只接受**声明式参数**——地址、字段路径映射、
          JSON / GraphQL 查询文档，没有表达式，也没有求值器。
        - 新增功能要能落进现有架构（单一事实来源、依赖方向单向），并且改动范围可控；
          大改动一般需要先在 `docs/` 写方案再动代码。

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已经搜索过现有 issue，没有找到相同的建议
          required: true
        - label: 这个建议符合上面写的项目范围
          required: true
