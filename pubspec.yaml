name: tune
description: "Tune：紧凑的本地与在线音乐播放器。"
# The following line prevents the package from being accidentally published to
# pubspec.yaml:6:11
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.15.0+16

environment:
  sdk: ^3.8.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true               # 启用 iOS 图标生成
  image_path: "branding/app_icon.png"  # 原图路径
  min_sdk_android: 21       # Android 最低支持版本（可选）
  web:
    generate: true          # 启用 Web 图标生成
  windows:
    generate: true          # 启用 Windows 图标生成
    icon_size: 256          # 任务栏按 256 取图，缩小时才不会糊
  macos:
    generate: true          # 启用 macOS 图标生成
# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 日志
  logger: ^2.6.1

  # Audio playback
  just_audio: ^0.10.4
  audio_session: ^0.2.3

  # D-Bus, for the media controls and the system tray of the desktop.
  # file_picker still asks for the 0.7 line, so 0.8 cannot come in yet.
  dbus: ^0.7.15

  # State management
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Path package for path manipulation
  path: ^1.9.0

  # Reads the lyrics files that were written in another encoding
  charset: ^2.0.1

  # Local storage
  shared_preferences: ^2.5.3

  # Network requests
  dio: ^5.4.0

  # RSS parsing for the podcast source
  xml: ^6.6.1

  # Token signing for the Subsonic source
  crypto: ^3.0.7

  # Routing
  go_router: ^16.1.0

  # Path provider
  path_provider: ^2.1.3

  audio_metadata_reader: ^1.4.2

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Window management for desktop
  window_manager: ^0.5.0

  file_picker: ^10.3.1
  # Windows audio backend.
  just_audio_windows: ^0.2.2
  # Linux audio backend for just_audio (media_kit + system libmpv).
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  sqlite3: ^3.8.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  # 生成 Linux 主题图标
  image: ^4.12.0
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true
  # 添加assets配置
  assets:
    - assets/icons/
    - LICENSE
    - THIRD_PARTY_NOTICES.md
    - assets/fonts/Fraunces/OFL.txt
    - assets/fonts/InstrumentSans/OFL.txt
    - assets/fonts/JetBrainsMono/OFL.txt
    - assets/fonts/NotoSansSC/OFL.txt
    - assets/fonts/NotoSerifSC/OFL.txt
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces/Fraunces-Variable.ttf
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans/InstrumentSans-Variable.ttf
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/NotoSansSC/NotoSansSC-VF.ttf
    - family: Noto Serif SC
      fonts:
        - asset: assets/fonts/NotoSerifSC/NotoSerifSC-VF.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Italic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-BoldItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraBold.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraBoldItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraLight.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraLightItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Italic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Light.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-LightItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-MediumItalic.ttf