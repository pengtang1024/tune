name: tune
description: "Tune：让每一段旋律都找到归属 在喧嚣的日常里，总有一些旋律会悄悄住进心里 —— 可能是清晨唤醒你的轻快节奏，是深夜陪伴你的温柔民谣，或是旅途中偶然邂逅的惊喜单曲。 Tune 不止是一款音乐播放器，更是你私人的「旋律收纳箱」。在这里，你可以轻松整理本地音乐库，按风格、心情或场景自定义歌单，让每首歌都在最合适的位置等你；流畅的播放体验搭配细腻的音效调节，让耳机里的每一个音符都清晰饱满，仿佛置身现场；简约而不简单的界面设计，藏着对音乐的纯粹热爱，没有多余干扰，只有你与音乐的独处时光。 无论是珍藏多年的经典老歌，还是刚发现的小众佳作，Tune 都能帮你妥帖安放，让每一次点开都成为一场美好的听觉重逢。 用 Tune，让音乐回归本真，让每段时光都有旋律相伴。"
# The following line prevents the package from being accidentally published to
# pubspec.yaml:6:11
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

flutter_icons:  # 与插件名称保持一致，消除警告
  android: "launcher_icon"
  ios: true               # 启用 iOS 图标生成
  image_path: "assets/icons/app_icon.png"  # 原图路径
  min_sdk_android: 21       # Android 最低支持版本（可选）
  web:
    generate: true          # 启用 Web 图标生成
  windows:
    generate: true          # 启用 Windows 图标生成
  macos:
    generate: true          # 启用 macOS 图标生成
# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 日志
  logger: ^2.6.1

  # Audio playback
  just_audio: ^0.10.4
  audio_session: ^0.2.3

  # State management
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Path package for path manipulation
  path: ^1.9.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0

  # Network requests
  dio: ^5.4.0

  # Routing
  go_router: ^16.1.0

  # Network connectivity
  connectivity_plus: ^6.0.3

  # Local music query
  on_audio_query: ^2.6.6

  # Permissions
  permission_handler: ^12.0.1

  # Background tasks
  workmanager: ^0.9.0+2

  # UI components
  flutter_screenutil: ^5.9.0

  # Path provider
  path_provider: ^2.1.3

  audio_metadata_reader: ^1.4.2

  # Notifications
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^4.1.1
  timezone: ^0.10.1
  # Equatable for value equality
  equatable: ^2.0.5

  # RxDart for reactive programming
  rxdart: ^0.28.0

  # Dependency injection
  get_it: ^8.2.0

  # JSON serialization
  json_annotation: ^4.9.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # FlexColorScheme for advanced theme management
  flex_color_scheme: ^8.2.0

  # Window management for desktop
  window_manager: ^0.5.0

  file_picker: ^10.3.1
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.9.0
  just_audio_windows: ^0.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.7
  hive_generator: ^2.0.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true
  # 添加assets配置
  assets:
    - assets/icons/
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Bold.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Italic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-BoldItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraBold.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraBoldItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraLight.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-ExtraLightItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Italic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Light.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-LightItalic.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Medium.ttf
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-MediumItalic.ttf